# Continuous integration: every push to main and every pull request is
# type-checked, unit-tested and built into the files Obsidian loads, on the two
# Node versions in active support. The built plugin is kept as an artifact, so
# any commit can be tried in a vault without building it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -noEmit -skipLibCheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: node esbuild.config.mjs production

      - name: Check manifest, versions and build
        run: node scripts/check-release.mjs --built

      - name: Report the bundle
        if: matrix.node == 20
        run: |
          {
            echo "### Recall Lab $(node -p 'require("./manifest.json").version') bundle"
            echo ""
            echo "| File | Size |"
            echo "| --- | ---: |"
            for f in main.js manifest.json styles.css; do
              echo "| \`$f\` | $(wc -c < "$f" | tr -d ' ') bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the built plugin
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: recall-lab-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Only the runtime dependency ships inside main.js; dev tooling never
      # reaches a vault, so its advisories are reported but do not fail the run.
      - name: Audit what ships
        run: npm audit --omit=dev --audit-level=high

      - name: Report on dev tooling
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories in development dependencies"
